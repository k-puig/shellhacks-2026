services:
  dodo-rest:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - PGSQL_HOST=psql
      - PGSQL_PORT=5432
      - PGSQL_DATABASE=${POSTGRES_DB}
      - PGSQL_USER_NAME=${POSTGRES_USER}
      - PGSQL_PASSWORD=${POSTGRES_PASSWORD}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
      - BASE_URL=${BASE_URL}
      - COOKIE_SECRET=${COOKIE_SECRET}
    depends_on:
      psql:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - deno
        - eval
        - 'const response = await fetch("http://localhost:8000/api/v1"); if (!response.ok) Deno.exit(1);'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  dodo-protoweb:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID}
    command: deno run protoweb
    environment:
      - VITE_AUTH0_DOMAIN=${VITE_AUTH0_DOMAIN}
      - VITE_AUTH0_CLIENT_ID=${VITE_AUTH0_CLIENT_ID}
    depends_on:
      dodo-rest:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "5173:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    command: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    depends_on:
      dodo-rest:
        condition: service_started
      dodo-protoweb:
        condition: service_started

  psql:
    image: postgres:18
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
      - RUSTFS_ADDRESS=:9000
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  rustfs-data:
