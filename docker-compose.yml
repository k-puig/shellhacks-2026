services:
  dodo-rest:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - PGSQL_HOST=${POSTGRES_HOST}
      - PGSQL_PORT=${POSTGRES_PORT}
      - PGSQL_DATABASE=${POSTGRES_DB}
      - PGSQL_USER_NAME=${POSTGRES_USER}
      - PGSQL_PASSWORD=${POSTGRES_PASSWORD}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
      # Identifier of the Auth0 API the mobile app's tokens are issued for
      # (e.g. https://dodo.gay/). Without it every mobile request gets 401.
      - AUTH0_API_AUDIENCE=${AUTH0_API_AUDIENCE}
      - BASE_URL=${BASE_URL}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
    depends_on:
      rustfs:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - deno
        - eval
        - 'const response = await fetch("http://localhost:8000/api/v1"); if (!response.ok) Deno.exit(1);'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  dodo-splash:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: deno run splash
    depends_on:
      dodo-rest:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "5173:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    command: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    depends_on:
      dodo-rest:
        condition: service_started
      dodo-splash:
        condition: service_started

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
      - RUSTFS_ADDRESS=:9000
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  rustfs-data:
