services:
  dodo-rest:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - PGSQL_HOST=psql
      - PGSQL_PORT=5432
      - PGSQL_DATABASE=${POSTGRES_DB}
      - PGSQL_USER_NAME=${POSTGRES_USER}
      - PGSQL_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      psql:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - deno
        - eval
        - 'const response = await fetch("http://localhost:8000/api/v1/"); if (!response.ok) Deno.exit(1);'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  psql:
    image: postgres:18
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
      - RUSTFS_ADDRESS=:9000
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  rustfs-data:
